name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: tools
        uses: actions/cache@v6.1.0
        with:
          path: .tools
          key: caudra-models-${{ runner.os }}-${{ hashFiles('caudra.toml', 'Makefile') }}
      - if: steps.tools.outputs.cache-hit != 'true'
        run: make tool
      - run: make check
        env:
          PUBLISHED_REF: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
      - run: make test
