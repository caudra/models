name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: tools
        uses: actions/cache@v6.1.0
        with:
          path: .tools
          key: caudra-models-${{ runner.os }}-${{ hashFiles('caudra.toml') }}
      - if: steps.tools.outputs.cache-hit != 'true'
        run: make tool
      - run: make check
      - name: Sign
        env:
          CAUDRA_MODELS_SIGNING_KEY: ${{ secrets.CAUDRA_MODELS_SIGNING_KEY }}
        run: |
          : "${CAUDRA_MODELS_SIGNING_KEY:?set the CAUDRA_MODELS_SIGNING_KEY secret}"
          .tools/bin/caudra-models sign dist/v1/models.json
      - name: Verify
        env:
          PUBLIC_KEY: ${{ vars.CAUDRA_MODELS_PUBLIC_KEY }}
        run: |
          : "${PUBLIC_KEY:?set the CAUDRA_MODELS_PUBLIC_KEY variable}"
          .tools/bin/caudra-models verify dist/v1/models.json --key "$PUBLIC_KEY"
      - uses: actions/upload-artifact@v7
        with:
          name: models-v1
          if-no-files-found: error
          path: |
            dist/v1/models.json
            dist/v1/models.json.sig
            dist/v1/schema.json
